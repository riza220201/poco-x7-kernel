# ═══════════════════════════════════════════════════════════════════════════════
# device.conf — Device & KMI ABI configuration for Xiaomi Poco X7 / Redmi Note 14 Pro 5G
# Codename: malachite (O16U) · SoC: MediaTek Dimensity 7300-Ultra (MT6878)
# Stock firmware baseline: OS2.0.206.0.VOOMIXM (Android 15 / HyperOS 2.0)
# ═══════════════════════════════════════════════════════════════════════════════
# Every key uses `: "${VAR:=default}"` so caller environment variables win
# (e.g. `MODULE_LAYOUT=0xdeadbeef ./build.sh` can be used to test preflight).

# ── Identity & Branding ──────────────────────────────────────────────────────
: "${DEVICE_LABEL:=Poco X7}"
: "${DEVICE_FULL_LABEL:=Xiaomi Poco X7 / Redmi Note 14 Pro 5G (malachite)}"
: "${DEVICE_SOC:=MediaTek Dimensity 7300-Ultra (MT6878)}"
: "${DEVICE_CODENAME:=malachite}"
: "${DEVICE_NAMES:=malachite malachite_global malachite_in}"
: "${BRAND:=Riza}"
: "${BRAND_FULL:=Riza Kernel}"
: "${KBUILD_BUILD_USER:=riza}"
: "${KBUILD_BUILD_HOST:=${BRAND}Kernel}"

# ── Boot Image Packaging ─────────────────────────────────────────────────────
# Stock boot.img is Android boot header v4, PAGESIZE=4096, RAMDISK_SZ=0,
# KERNEL_FMT=lz4_legacy.
: "${KERNEL_FMT:=lz4}"

# ── Toolchain ────────────────────────────────────────────────────────────────
# Neutron clang 24.0.0git (06092026, llvm f42c87ba)
: "${CLANG_DIR:=/home/riza/itel-rs4-kernel/toolchain/neutron-clang-06092026}"
: "${BUILD_TOOLS_DIR:=/home/riza/itel-rs4-kernel/toolchain/build/build-tools/path/linux-x86}"

# ── KMI ABI Target (android14-6.1 KMI generation 11) ─────────────────────────
# Agreed across all 464 vendor modules (241 vendor_dlkm + 223 vendor_boot),
# all 60 system_dlkm modules, and stock boot.img's vmlinux (__kcrctab).
: "${MODULE_LAYOUT:=0xea759d7f}"

# Reference trees harvested by tools/extract-device-material.sh
: "${KMI_REF_TREE:=${PROJ:-$(pwd)}/.build/kmi-ref}"
: "${KMI_REF_SYSTEM_TREE:=${PROJ:-$(pwd)}/.build/kmi-ref-system}"
: "${STOCK_SYMVERS:=${PROJ:-$(pwd)}/.build/stock/stock.symvers}"

# Provenance vermagics asserted by Gate Layer 1
: "${KMI_EXPECT_VERMAGIC:=6.1.115-android14-11-g15551c4b2ca8}"
: "${KMI_SYSTEM_EXPECT_VERMAGIC:=6.1.115-android14-11-gfaa9b1b32a11-ab13269000}"
export KMI_EXPECT_VERMAGIC KMI_SYSTEM_EXPECT_VERMAGIC

# Zero waivers: every vendor and system_dlkm module must pass 100%
: "${KMI_VENDOR_KNOWN_BAD:=}"
: "${KMI_SYSTEM_KNOWN_BAD:=}"
: "${KMI_UNRESOLVED_EXPECTED:=}"
export KMI_VENDOR_KNOWN_BAD KMI_SYSTEM_KNOWN_BAD KMI_UNRESOLVED_EXPECTED

# ── Stock Inputs ─────────────────────────────────────────────────────────────
: "${STOCK_BOOT_IMG:=${PROJ:-$(pwd)}/boot.img}"
: "${STOCK_VENDOR_BOOT_IMG:=${PROJ:-$(pwd)}/vendor_boot.img}"
: "${STOCK_VENDOR_DLKM_IMG:=${PROJ:-$(pwd)}/vendor_dlkm.img}"
: "${STOCK_SYSTEM_DLKM_IMG:=${PROJ:-$(pwd)}/system_dlkm.img}"
: "${STOCK_ODM_DLKM_IMG:=${PROJ:-$(pwd)}/odm_dlkm.img}"
: "${STOCK_CONFIG:=${PROJ:-$(pwd)}/.build/ikconfig/stock.config}"
: "${KERNEL_SRC:=${PROJ:-$(pwd)}/.build/kernel-src}"
